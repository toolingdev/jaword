[package]
name = "jaword"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/toolingdev/jaword"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
jaword-core = { version = "0.2.0", path = "../core" }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
zeroize = { version = "1.9.2", features = ["serde"] }

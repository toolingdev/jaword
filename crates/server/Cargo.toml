[package]
name = "jawordd"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/toolingdev/jaword"

[dependencies]
axum = "0.8.9"
hex = "0.4.3"
hyper = "1"
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "http1", "http2"] }
jaword-core = { version = "0.3.0", path = "../core" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = { version = "1.9.2", features = ["serde"] }
